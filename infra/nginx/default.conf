resolver 127.0.0.11 valid=5s ipv6=off;

upstream configuration_backend {
    zone configuration_backend 64k;
    server configuration:8000 resolve;
}

upstream catalog_backend {
    zone catalog_backend 64k;
    server catalog:8000 resolve;
}

upstream orders_backend {
    zone orders_backend 64k;
    server orders:8000 resolve;
}

upstream deliveries_backend {
    zone deliveries_backend 64k;
    server deliveries:8000 resolve;
}

upstream tables_backend {
    zone tables_backend 64k;
    server tables:8000 resolve;
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    # Only known public prefixes are forwarded. /internal is never proxied.
    location /api/configuration/health/ {
        proxy_pass http://configuration_backend/health/;
        proxy_set_header X-Request-ID $http_x_request_id;
    }
    location /api/configuration/v1/ {
        proxy_pass http://configuration_backend/v1/;
        proxy_set_header X-Request-ID $http_x_request_id;
        proxy_read_timeout 10s;
    }
    location /api/catalog/health/ {
        proxy_pass http://catalog_backend/health/;
        proxy_set_header X-Request-ID $http_x_request_id;
    }
    location /api/catalog/v1/ {
        proxy_pass http://catalog_backend/v1/;
        proxy_set_header X-Request-ID $http_x_request_id;
        proxy_read_timeout 10s;
    }
    location /api/orders/health/ {
        proxy_pass http://orders_backend/health/;
        proxy_set_header X-Request-ID $http_x_request_id;
    }
    location /api/orders/v1/ {
        proxy_pass http://orders_backend/v1/;
        proxy_set_header X-Request-ID $http_x_request_id;
        proxy_read_timeout 10s;
    }
    location /api/deliveries/health/ {
        proxy_pass http://deliveries_backend/health/;
        proxy_set_header X-Request-ID $http_x_request_id;
    }
    location /api/tables/health/ {
        proxy_pass http://tables_backend/health/;
        proxy_set_header X-Request-ID $http_x_request_id;
    }
    location /api/tables/v1/ {
        proxy_pass http://tables_backend/v1/;
        proxy_set_header X-Request-ID $http_x_request_id;
        proxy_read_timeout 10s;
    }
    location /api/ { return 404; }
    location /internal/ { return 404; }
    location / { try_files $uri $uri/ /index.html; }
}
